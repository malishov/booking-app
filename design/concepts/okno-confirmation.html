const baseRender=render;
render=function(focus=false){baseRender(focus);$$('.eyebrow').forEach(e=>e.style.textTransform='none');if(step===2&&mode==='client'){$('#phone').addEventListener('focus',()=>document.body.classList.add('keyboard-open'));$('#phone').addEventListener('blur',()=>document.body.classList.remove('keyboard-open'));$('#name').addEventListener('focus',()=>document.body.classList.add('keyboard-open'));$('#name').addEventListener('blur',()=>document.body.classList.remove('keyboard-open'))}else document.body.classList.remove('keyboard-open')}
function state(){return {okno:true,mode,tab,day,step,service,date,time}}
function navigate(focus=false){history.pushState(state(),'');render(focus)}
history.replaceState(state(),'');window.addEventListener('popstate',e=>{if(e.state?.okno){saveDraft();({mode,tab,day,step,service,date,time}=e.state);render(true)}});
document.addEventListener('focusin',e=>{if(e.target.matches('input,select'))document.body.classList.add('keyboard-open')});document.addEventListener('focusout',()=>{document.body.classList.remove('keyboard-open')});
// Comparison controls communicate only with their local same-origin parent.
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='okno-compare')return;if(e.data.palette){const b=document.querySelector(`.palette-option[data-palette="${e.data.palette}"]`);if(b)b.click()}if(e.data.mode){mode=e.data.mode;step=0;render()}});
render();

// Flexible client date picker. Day indices are relative to November 2026.
function dateObject(d){return new Date(Date.UTC(2026,10,d))}
function dateIndex(d){return Math.round((d-Date.UTC(2026,10,1))/86400000)+1}
function dateLabel(d){return new Intl.DateTimeFormat('ru',{day:'numeric',month:'long',timeZone:'UTC'}).format(dateObject(d))}
function monthLabel(d){return new Intl.DateTimeFormat('ru',{month:'long',year:'numeric',timeZone:'UTC'}).format(dateObject(d))}
function weekStart(d){return d-(dateObject(d).getUTCDay()+6)%7}
function nextAvailable(from=19){for(let d=Math.max(19,from);d<=78;d++)if(availableSlots(d).length)return d;return null}
let visibleWeek=weekStart(19);
function chooseDate(d){if(!availableSlots(d).length)return;date=d;visibleWeek=weekStart(d);ensureSlot();history.replaceState(state(),'');client()}
function showMonth(){let viewed=dateObject(date),pending=date;viewed.setUTCDate(1);
 openSheet('Выберите дату','<div id="monthContent"></div>');
 function drawMonth(){const first=dateIndex(viewed),n=new Date(Date.UTC(viewed.getUTCFullYear(),viewed.getUTCMonth()+1,0)).getUTCDate(),offset=(viewed.getUTCDay()+6)%7;
 $('#monthContent').innerHTML=`<p class="tiny">${services[service][0]} · ${services[service][1]} минут<br>Баку, UTC+4</p><div class="calendar-toolbar"><button id="prevMonth" aria-label="Предыдущий месяц" ${first<=1?'disabled':''}>‹</button><h3 aria-live="polite">${monthLabel(first)}</h3><button id="nextMonth" aria-label="Следующий месяц" ${first+n>78?'disabled':''}>›</button></div><div class="calendar-grid" role="group" aria-label="Даты месяца">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="weekday" aria-hidden="true">${d}</span>`).join('')}${'<span aria-hidden="true"></span>'.repeat(offset)}${Array.from({length:n},(_,i)=>{const d=first+i,ok=availableSlots(d).length>0;return `<button data-calendar-day="${d}" aria-label="${dateLabel(d)}${ok?' · есть свободное время':' · недоступно'}" aria-pressed="${pending===d}" ${ok?'':'disabled'}>${i+1}</button>`}).join('')}</div><p class="calendar-legend">Зачёркнутые даты недоступны для выбранной услуги. Запись на 60 дней вперёд.</p><div class="calendar-selected"><p id="pendingDate" role="status">${dateLabel(pending)}</p><button class="primary full" id="applyDate" ${availableSlots(pending).length?'':'disabled'}>Выбрать дату</button></div>`;
 $('#prevMonth').onclick=()=>{viewed.setUTCMonth(viewed.getUTCMonth()-1);drawMonth();$('#prevMonth').focus()};$('#nextMonth').onclick=()=>{viewed.setUTCMonth(viewed.getUTCMonth()+1);drawMonth();$('#nextMonth').focus()};
 $$('[data-calendar-day]').forEach(b=>b.onclick=()=>{pending=+b.dataset.calendarDay;$$('[data-calendar-day]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.calendarDay===pending));$('#pendingDate').textContent=dateLabel(pending);$('#applyDate').disabled=false});
 $('#applyDate').onclick=()=>{$('#dialog').close();chooseDate(pending);$('#openMonth').focus()};
 }drawMonth()
}
const clientBeforeCalendar=client;
client=function(){clientBeforeCalendar();if(step!==1)return;
 const choices=$('.datechoices');if(!choices)return;
 const start=visibleWeek;choices.outerHTML=`<section class="date-navigation" aria-label="Выбор дня"><div class="month-row"><button class="month-open" id="openMonth" aria-haspopup="dialog">${monthLabel(Math.max(start,19))} ${icon('day')}</button><div class="week-arrows"><button id="prevWeek" aria-label="Предыдущая неделя" ${start<=weekStart(19)?'disabled':''}>‹</button><button id="nextWeek" aria-label="Следующая неделя" ${start+7>78?'disabled':''}>›</button></div></div><div class="date-week">${Array.from({length:7},(_,i)=>{const d=start+i;return `<button data-week-date="${d}" aria-label="${dateLabel(d)}" aria-pressed="${date===d}" ${availableSlots(d).length?'':'disabled'}><small>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</small><strong>${dateObject(d).getUTCDate()}</strong></button>`}).join('')}</div><button class="nearby" id="nearest">Ближайшее время →</button></section>`;
 $('#openMonth').onclick=showMonth;$('#prevWeek').onclick=()=>{visibleWeek-=7;client();$('#prevWeek').focus()};$('#nextWeek').onclick=()=>{visibleWeek+=7;client();$('#nextWeek').focus()};$$('[data-week-date]').forEach(b=>b.onclick=()=>chooseDate(+b.dataset.weekDate));
 $('#nearest').onclick=()=>{const d=nextAvailable();if(d!==null){chooseDate(d);$('#nearest').focus()}};
 const slots=$('.slots');slots.previousElementSibling.classList.add('slots-title');slots.previousElementSibling.textContent='Время · '+dateLabel(date);
 if(!availableSlots().length){const next=nextAvailable(date+1);slots.innerHTML=`<div style="grid-column:1/-1"><p class="sub">На ${dateLabel(date)} нет времени для этой услуги</p>${next!==null?`<button id="nextFreeDay" class="full">Ближайшее окно · ${dateLabel(next)}</button>`:''}</div>`;if($('#nextFreeDay'))$('#nextFreeDay').onclick=()=>chooseDate(next)}
 $$('[data-time]').forEach(b=>b.onclick=()=>{time=b.dataset.time;history.replaceState(state(),'');client()});
}
// Standalone link opens the requested client step without changing the comparison defaults.
if(true){mode='client';step=1;const d=nextAvailable();if(d!==null){date=d;visibleWeek=weekStart(d)}history.replaceState(state(),'')}
render();

let stripStart=date;
function availabilityText(d){if(d<19||d>78)return 'Недоступно';if([0,6].includes(dateObject(d).getUTCDay()))return 'Выходной';const n=availableSlots(d).length;if(!n)return 'Нет мест';const word=n%10===1&&n%100!==11?'окно':n%10>=2&&n%10<=4&&!(n%100>=12&&n%100<=14)?'окна':'окон';return `${n} ${word}`}
const calendarClient=client;
chooseDate=function(d){if(!availableSlots(d).length)return;date=d;if(d<stripStart||d>stripStart+4)stripStart=Math.min(d,74);ensureSlot();history.replaceState(state(),'');client()};
client=function(){calendarClient();const provider='<div class="reference-provider"><div class="avatar" aria-hidden="true">ЛА</div><div><h2>Лейла Алиева</h2><p>Мастер маникюра · Баку</p></div></div>';
 if(step<3){$('#content').insertAdjacentHTML('afterbegin',provider)}
 if(step===0){$('#content>h1').textContent='Выберите услугу'}
 if(step===1){$('#content>h1').textContent='Выберите дату и время';$('#content>h1').classList.add('reference-title');const sub=$('#content>.sub');sub.outerHTML=`<div class="reference-service"><div><strong>${services[service][0]}</strong><small>${services[service][1]} минут · ${services[service][2]} ₼</small></div><button id="editService">Изменить</button></div>`;$('#editService').onclick=()=>{step=0;navigate(true)};
 const start=stripStart;$('.date-navigation').innerHTML=`<div class="month-row"><button id="openMonth" class="month-open" aria-haspopup="dialog">${monthLabel(start)} ${icon('day')}</button><div class="week-arrows"><button id="stripPrev" aria-label="Предыдущие пять дней" ${start<=19?'disabled':''}>‹</button><button id="stripNext" aria-label="Следующие пять дней" ${start>=74?'disabled':''}>›</button></div></div><div class="date-week">${Array.from({length:5},(_,i)=>{const d=start+i;return `<button data-ref-date="${d}" aria-pressed="${date===d}" aria-label="${dateLabel(d)} · ${availabilityText(d)}" ${availableSlots(d).length?'':'disabled'}><small>${new Intl.DateTimeFormat('ru',{weekday:'short',timeZone:'UTC'}).format(dateObject(d))}</small><strong>${dateObject(d).getUTCDate()}</strong><span class="availability">${availabilityText(d)}</span></button>`}).join('')}</div><button class="nearby" id="nearest">Ближайшее время →</button>`;
 $('#openMonth').onclick=showMonth;$('#stripPrev').onclick=()=>{stripStart=Math.max(19,stripStart-5);client();$('#stripPrev').focus()};$('#stripNext').onclick=()=>{stripStart=Math.min(74,stripStart+5);client();$('#stripNext').focus()};$$('[data-ref-date]').forEach(b=>b.onclick=()=>chooseDate(+b.dataset.refDate));$('#nearest').onclick=()=>{const d=nextAvailable();if(d!==null)chooseDate(d)};
 $('.slots').insertAdjacentHTML('beforebegin',`<div class="reference-meta"><span>Баку · UTC+4</span><span>${services[service][1]} минут</span></div>`);
 $('.slots').nextElementSibling.textContent='Выберите время начала. Часовой пояс указан для места приёма.';
 }
 if(step===3){$('#content').innerHTML=`<div class="reference-success"><header class="success-hero"><span class="spark one" aria-hidden="true"></span><span class="spark two" aria-hidden="true"></span><span class="spark three" aria-hidden="true"></span><div class="success-emblem" aria-hidden="true"><span class="back-card"></span><span class="front-card"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="17"></circle><path class="tick" d="m16 24 6 6 11-13" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div><h1>Готово!<br>Вы записаны</h1><p>Ждём вас ${dateLabel(date)} в ${time}</p><span class="success-note">Ваше время выбрано</span></header><div class="confirmation-card"><div class="confirmation-person"><div class="avatar" aria-hidden="true">ЛА</div><div><strong>Лейла Алиева</strong><small>Мастер маникюра</small></div></div><div class="confirmation-row"><small>Когда</small><strong>${dateLabel(date)} · ${time}–${end()}</strong><span class="muted">Баку, UTC+4</span></div><div class="confirmation-row"><small>Услуга</small><strong>${services[service][0]}</strong><span class="muted">${services[service][1]} минут · ${services[service][2]} ₼</span></div><div class="confirmation-row"><small>Место</small><strong>Баку, ул. Низами, 42</strong><span class="muted">Демонстрационный адрес</span></div></div><div class="confirmation-actions"><button class="primary" id="downloadCalendar">Добавить в календарь</button><button id="saveDemoLink">Сохранить ссылку</button></div><div class="reference-feedback" id="savedFeedback" role="status"></div><p class="reference-help">Это макет: встреча не создана. Ссылка открывает только демонстрацию, без ваших контактов. В приложении здесь будут правила отмены и контакт мастера.</p><button class="back" id="newBooking">← Вернуться к выбору</button></div>`;
 $('#newBooking').onclick=()=>{step=1;navigate(true)};
 $('#saveDemoLink').onclick=async()=>{const url=new URL(location.href);url.hash=`demo=${service},${date},${time.replace(':','')}`;try{await navigator.clipboard.writeText(url.href);$('#savedFeedback').textContent='Ссылка на демонстрацию скопирована'}catch{$('#savedFeedback').textContent='Скопируйте ссылку на демонстрацию:';const input=document.createElement('input');input.readOnly=true;input.value=url.href;input.setAttribute('aria-label','Ссылка на демонстрацию');$('#savedFeedback').append(input);input.select()}};
 $('#downloadCalendar').onclick=()=>{const start=dateObject(date);start.setUTCHours(Math.floor(minutes(time)/60)-4,minutes(time)%60);const finish=new Date(start.getTime()+services[service][1]*60000);const stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Okno//Design Demo//RU','BEGIN:VEVENT',`UID:demo-${date}-${service}-${time.replace(':','')}@okno.invalid`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(start)}`,`DTEND:${stamp(finish)}`,'SUMMARY:ДЕМО — '+services[service][0],'LOCATION:Демонстрационный адрес: Баку\, ул. Низами\, 42','DESCRIPTION:Демонстрация интерфейса. Реальная запись не создана.','END:VEVENT','END:VCALENDAR'].join('\r\n');const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='okno-demo.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#savedFeedback').textContent='Скачан пример события. Встреча помечена как ДЕМО'};
 }
};
const demoMatch=location.hash.match(/^#demo=(\d),(\d+),(\d{4})$/);if(demoMatch){const si=+demoMatch[1],d=+demoMatch[2],t=demoMatch[3].slice(0,2)+':'+demoMatch[3].slice(2);if(si<services.length&&availableSlots(d,si).includes(t)){service=si;date=d;time=t;step=3}}
mode='client';step=3;stripStart=Math.max(19,Math.min(date,74));history.replaceState(state(),'');render();
