function openSheet(title,body){$('#sheet').innerHTML=`<div class="handle"></div><div class="sheet-head"><span class="eyebrow">Окно · демо</span><button class="close" aria-label="Закрыть">×</button></div><h2 id="sheetTitle">${title}</h2>${body}`;$('#sheet .close').onclick=()=>$('#dialog').close();$('#dialog').showModal()}
function detail(i){const v=visits[i],s=services[v[3]];openSheet(v[2],`<span class="badge">Подтверждена</span><p>${s[0]}</p><dl><dt>Когда</dt><dd>19 ноября</dd><dt>Время</dt><dd>${v[0]}–${v[1]}</dd><dt>Стоимость</dt><dd>${s[2]} ₼</dd></dl><button class="primary full" id="move">Перенести</button><p class="tiny">Действия показаны для демонстрации. Реальная запись не меняется.</p>`);$('#move').onclick=()=>{openSheet('Перенести запись',`<p class="sub">${v[2]} · ${s[0]}<br>Сейчас: 19 ноября, ${v[0]}</p><label>Новая дата<input id="moveDate" type="date" value="2026-11-20" min="2026-11-19"></label><label>Свободное время<select id="moveTime" style="font:inherit;padding:14px;border-radius:12px"><option>11:00</option><option>14:00</option></select></label><button class="primary full" id="moveConfirm">Показать результат</button>`);$('#moveConfirm').onclick=()=>{openSheet('Пример переноса',`<p class="sub">Новое время: ${$('#moveDate').value}, ${$('#moveTime').value}.</p><p>В рабочем приложении после сохранения мастер сообщает клиенту новое время.</p><p class="tiny">Это демонстрация: данные не сохранены.</p>`)}}}

function master(){let html='';if(tab==='day'){html=`<div class="eyebrow">Ноябрь 2026 · Баку, UTC+4</div><div class="heading"><h1>${day===19?'Сегодня':day+' ноября'}</h1><button id="new" aria-label="Записать клиента">+ Запись</button></div><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<button data-day="${16+i}" aria-pressed="${day===16+i}"><small>${d}</small><strong>${16+i}</strong></button>`).join('')}</div>`;if(day===19)html+=`<button class="next" data-visit="1"><div class="eyebrow"><span>Следующий визит</span><span>12:00–12:45</span></div><h2>Нармин Гасанова</h2><p>Маникюр без покрытия</p><footer><span>45 минут · 20 ₼</span><span>Открыть →</span></footer></button><div class="section"><h2>План дня</h2><span>3 записи · 105 ₼</span></div>${visits.map((v,i)=>`<button class="visit" data-visit="${i}"><span class="clock">${v[0]}</span><span><strong>${v[2]}</strong><small>${services[v[3]][0]}</small><small>До ${v[1]} · ${services[v[3]][2]} ₼ · подтверждена</small></span><span class="arrow">›</span></button>${i===0?'<button class="gap">+ Окно 10:30–12:00 · 1 ч 30 мин</button>':''}${i===1?'<div class="rest">Перерыв · 13:00–14:00</div><button class="gap">+ Окно 14:00–15:00 · 1 час</button>':''}`).join('')}<p class="tiny">Сумма записей — стоимость услуг, не оплата.<br>Текущее время в демо: 11:45.</p>`;else html+='<div class="empty"><h2>День пока свободен</h2><p class="muted">В этом макете визиты есть 19 ноября.</p><button class="primary" id="emptyNew">Записать клиента</button></div>'}else if(tab==='schedule'){html='<div class="eyebrow">Ваша доступность</div><h1>Расписание</h1><p class="sub">Рабочая неделя · Баку, UTC+4</p>'+['Понедельник','Вторник','Среда','Четверг','Пятница'].map(d=>`<div class="card"><strong>${d}</strong><p>09:00–18:00 · перерыв 13:00–14:00</p></div>`).join('')+'<div class="rest">Суббота и воскресенье · выходные</div><button id="hours" class="full">Изменить часы · демо</button>'}else{html='<div class="eyebrow">Публичный профиль</div><h1>Моя страница</h1><div class="card"><h2>Лейла Алиева</h2><p>Мастер маникюра · Баку</p><span class="badge">Страница опубликована · пример</span></div><button class="primary full" id="preview">Посмотреть глазами клиента</button><div class="section"><h2>Услуги и цены</h2></div>'+services.map(s=>`<div class="card"><strong>${s[0]}</strong><p>${s[1]} минут · ${s[2]} ₼</p></div>`).join('')}
$('#content').innerHTML=html;$('#nav').hidden=false;$('#action').hidden=true;$('#nav').innerHTML=[['day','День'],['schedule','Расписание'],['page','Моя страница']].map(([k,t])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${icon(k)}${t}</button>`).join('');$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$$('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;render()});$$('[data-visit]').forEach(b=>b.onclick=()=>detail(+b.dataset.visit));$$('.gap,#new,#emptyNew').forEach(b=>b.onclick=manual);if($('#preview'))$('#preview').onclick=()=>setMode('client');if($('#hours'))$('#hours').onclick=()=>openSheet('Изменение расписания','<p class="sub">На отдельном экране: дни недели, рабочие часы и перерыв. Сохранение — явной кнопкой внизу.</p><p>В этом прототипе редактирование не подключено.</p>')}
function summary(){return `${date} ноября · ${time} · ${services[service][2]} ₼`}
function client(){const s=services[service];$('#nav').hidden=true;$('#action').hidden=step===3;let html=`<div class="progress" aria-label="Шаг ${Math.min(step+1,3)} из 3">${[0,1,2].map(i=>`<i ${i<=step?'class="active"':''}></i>`).join('')}</div>`;if(step>0&&step<3)html+='<button class="back" id="back">← Назад</button>';if(step===0)html+='<div class="eyebrow">Лейла Алиева · Баку</div><h1>Начнём с услуги</h1><p class="sub">Шаг 1 из 3 · запись без регистрации</p><div class="services">'+services.map((v,i)=>`<button class="service" data-service="${i}" aria-pressed="${service===i}"><span class="price">${v[2]} ₼</span><strong>${v[0]}</strong><small>${v[1]} минут ${service===i?'· выбрано':''}</small></button>`).join('')+'</div><p class="tiny">После выбора покажем свободное время для этой услуги.</p>';if(step===1)html+=`<div class="eyebrow">Шаг 2 из 3</div><h1>Когда вам удобно?</h1><p class="sub">${s[0]} · ${s[1]} минут<br>Время мастера: Баку, UTC+4</p><div class="datechoices">${[19,20,21].map((d,i)=>`<button data-date="${d}" aria-pressed="${date===d}"><small>${['Чт','Пт','Сб'][i]}</small><strong>${d} ноя</strong></button>`).join('')}</div><h2>Свободное время</h2><div class="slots">${['11:00','14:00','16:00'].map(t=>`<button data-time="${t}" aria-pressed="${time===t}">${t}</button>`).join('')}</div><p class="tiny">Демонстрационные слоты. В приложении список учитывает длительность услуги и занятость мастера.</p>`;if(step===2)html+=`<div class="eyebrow">Шаг 3 из 3</div><h1>Осталось познакомиться</h1><div class="card"><strong>${s[0]}</strong><p>${date} ноября · ${time}–${end()}<br>${s[1]} минут · Баку, UTC+4</p><p>Итого: <strong>${s[2]} ₼</strong></p></div><form id="contact"><label>Ваше имя<input name="name" id="name" required autocomplete="given-name"></label><label>Телефон<input name="phone" id="phone" required type="tel" inputmode="tel" autocomplete="tel"></label><p class="tiny">Демо: данные не отправляются и не сохраняются.</p></form>`;if(step===3)html=`<div class="confirmed"><div class="check" aria-hidden="true">✓</div><div class="eyebrow" style="margin-top:24px">Пример подтверждения</div><h1>Время за вами.</h1><p class="sub">${s[0]}</p><div class="card"><h2>${date} ноября · ${time}</h2><p>До ${end()} · ${s[2]} ₼<br>Баку, UTC+4</p><p>Лейла Алиева<br>ул. Низами, 42 · демо-адрес</p></div><p class="tiny">В рабочем приложении здесь будут контакты мастера и правила отмены.</p><button id="again" class="full">Посмотреть ещё раз</button></div>`;$('#content').innerHTML=html;$('#action').innerHTML=`<div class="summary"><span>${step===0?s[1]+' минут':date+' ноября · '+time}</span><strong>${s[2]} ₼</strong></div><button class="primary full" id="next" ${step===2?'type="submit" form="contact"':''}>${['Выбрать время','Продолжить','Подтвердить · демо'][step]||''}</button>`;$$('[data-service]').forEach(b=>b.onclick=()=>{service=+b.dataset.service;client()});$$('[data-date]').forEach(b=>b.onclick=()=>{date=+b.dataset.date;client()});$$('[data-time]').forEach(b=>b.onclick=()=>{time=b.dataset.time;client()});if($('#next')&&step<2)$('#next').onclick=()=>{step++;render(true)};if($('#back'))$('#back').onclick=()=>{saveDraft();step--;render(true)};if(step===2){$('#name').value=draft.name;$('#phone').value=draft.phone;$('#contact').onsubmit=e=>{e.preventDefault();saveDraft();step=3;render(true)}}if($('#again'))$('#again').onclick=()=>{step=0;draft={name:'',phone:''};render(true)}}
function end(){let [h,m]=time.split(':').map(Number),n=h*60+m+services[service][1];return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function saveDraft(){if($('#name'))draft={name:$('#name').value,phone:$('#phone').value}}
function setMode(v){saveDraft();mode=v;render(true)}function render(focus=false){$('#masterMode').setAttribute('aria-pressed',mode==='master');$('#clientMode').setAttribute('aria-pressed',mode==='client');mode==='master'?master():client();if(focus){$('#content').setAttribute('tabindex','-1');$('#content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}$('#masterMode').onclick=()=>setMode('master');$('#clientMode').onclick=()=>setMode('client');render();

const paletteDescriptions={sage:'Шалфей и сливки · естественная и спокойная',clay:'Песок и глина · тёплая и уютная',mist:'Туман и голубой · свежая и воздушная',lavender:'Лён и лаванда · нежная и сдержанная'};
document.querySelectorAll('.palette-option').forEach(button=>button.addEventListener('click',()=>{const palette=button.dataset.palette;document.documentElement.dataset.palette=palette;document.querySelectorAll('.palette-option').forEach(option=>option.setAttribute('aria-pressed',option===button));document.getElementById('paletteDescription').textContent=paletteDescriptions[palette];}));
</script></body></html>
