version: "2"
sql:
  - engine: "postgresql"
    schema: "backend/migrations"
    queries: "backend/internal/store/query"
    gen:
      go:
        package: "store"
        out: "backend/internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
