services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      SESSION_COOKIE_SECURE: "false" # local HTTP only; use true with HTTPS
      DATABASE_URL: "postgres://booking:booking@postgres:5432/booking?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
